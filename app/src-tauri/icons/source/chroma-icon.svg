<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CHROMA app icon: white light enters a glass prism and fans out as a spectrum. 824px rounded square on a 1024 canvas (macOS grid). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b2e"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#7a4dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#cfd6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="0.2" stop-color="#ff9a1f"/>
      <stop offset="0.4" stop-color="#ffe14a"/>
      <stop offset="0.6" stop-color="#3ddc84"/>
      <stop offset="0.8" stop-color="#2aa8ff"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- spectrum fan leaving the prism's right face: 6 bands, glowing -->
    <g transform="translate(672 500) scale(0.7 1)">
      <polygon points="0,-18 360,-250 360,-120 0,18" fill="#ff3b5c" opacity="0.9"/>
      <polygon points="0,-12 360,-120 360,-10 0,10" fill="#ff9a1f" opacity="0.9"/>
      <polygon points="0,-6 360,-10 360,95 0,6" fill="#ffe14a" opacity="0.9"/>
      <polygon points="0,0 360,95 360,195 0,10" fill="#3ddc84" opacity="0.9"/>
      <polygon points="0,6 360,195 360,285 0,14" fill="#2aa8ff" opacity="0.9"/>
      <polygon points="0,10 360,285 360,360 0,18" fill="#9a5cff" opacity="0.9"/>
    </g>
    <g filter="url(#blur)" opacity="0.75" transform="translate(672 500) scale(0.7 1)">
      <polygon points="0,-18 360,-250 360,360 0,18" fill="url(#spec)"/>
    </g>
    <!-- incoming white beam, refracting through the glass to the exit point -->
    <polygon points="150,560 672,494 672,506 150,548" fill="url(#beam)" filter="url(#soft)"/>
    <polygon points="150,556 672,493 672,507 150,548" fill="url(#beam)"/>
    <!-- prism -->
    <polygon points="512,230 790,700 234,700" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="512,275 740,680 284,680" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="6" stroke-linejoin="round"/>
    <!-- hot spot where the beam meets glass -->
    <circle cx="672" cy="500" r="15" fill="#fff"/>
    <circle cx="672" cy="500" r="48" fill="#fff" opacity="0.25" filter="url(#soft)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="6"/>
</svg>
