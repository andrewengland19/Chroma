<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHROMA remote</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{ min-height:100vh; -webkit-user-select:none; user-select:none;
        background:radial-gradient(700px 520px at 50% 30%, #1d1d26, var(--bg) 70%) fixed }

  /* now playing */
  #np{ text-align:center; margin:4px 0 18px; min-height:40px }
  #npTitle{ font-weight:600; font-size:15px }
  #npSub{ color:var(--dim); font-size:12px; margin-top:2px }

  /* remote body: space-grey aluminum */
  .remote{ width:236px; margin:0 auto; padding:22px 22px 34px; border-radius:46px;
    background:linear-gradient(160deg,#4a4a52 0%,#2c2c33 38%,#232329 70%,#34343c 100%);
    box-shadow: inset 0 1px 0 #ffffff30, inset 0 -2px 6px #0008, 0 30px 60px -18px #000d,
                0 0 0 1px #000a; position:relative }
  .remote::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:repeating-linear-gradient(90deg,#ffffff05 0 1px,transparent 1px 3px) }
  .top{ display:flex; justify-content:flex-end; margin-bottom:14px }

  /* clickpad */
  .pad{ position:relative; width:192px; height:192px; margin:0 auto 22px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%,#1b1b20,#0e0e12 70%);
    box-shadow: inset 0 2px 8px #000c, 0 1px 0 #ffffff18, 0 0 0 1px #000; touch-action:none; cursor:pointer }
  .pad .dot{ position:absolute; width:5px; height:5px; border-radius:50%; background:#5a5a66;
    transition:background .15s, box-shadow .15s }
  .pad .dot.up{ top:14px; left:calc(50% - 2.5px) } .pad .dot.down{ bottom:14px; left:calc(50% - 2.5px) }
  .pad .dot.left{ left:14px; top:calc(50% - 2.5px) } .pad .dot.right{ right:14px; top:calc(50% - 2.5px) }
  .pad .arc{ position:absolute; inset:0; border-radius:50%; opacity:0; transition:opacity .25s;
    pointer-events:none }
  .pad .arc.show{ opacity:1; transition:opacity .04s }
  .pad .center{ position:absolute; inset:58px; border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#24242b,#141418);
    box-shadow: inset 0 1px 0 #ffffff14, 0 0 0 1px #000, 0 4px 10px #0009;
    transition:transform .08s, box-shadow .08s }
  .pad .center.press{ transform:scale(.93); box-shadow: inset 0 3px 8px #000c, 0 0 0 1px #000 }

  /* buttons */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 22px; justify-items:center }
  .btn{ width:62px; height:62px; border-radius:50%; border:none; padding:0; color:#e9e9ef;
    background:radial-gradient(circle at 50% 30%,#2a2a31,#17171b); font-size:20px;
    box-shadow: inset 0 1px 0 #ffffff1c, 0 0 0 1px #000, 0 5px 12px #0009;
    display:grid; place-items:center; transition:transform .08s, box-shadow .08s, color .2s }
  .btn svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .btn.small{ width:34px; height:34px; font-size:13px }
  .btn.small svg{ width:16px; height:16px }
  .btn.press, .vol button.press{ transform:scale(.92);
    box-shadow: inset 0 3px 8px #000c, 0 0 0 1px #000, 0 1px 2px #0009; color:#fff }
  .vol{ grid-row:span 2; width:62px; height:140px; border-radius:31px; overflow:hidden; display:flex; flex-direction:column;
    background:radial-gradient(circle at 50% 20%,#2a2a31,#17171b);
    box-shadow: inset 0 1px 0 #ffffff1c, 0 0 0 1px #000, 0 5px 12px #0009 }
  .vol button{ flex:1; border:none; background:none; color:#e9e9ef; font-size:26px; font-weight:300;
    border-radius:0; transition:transform .08s, background .1s }
  .vol button:active{ background:#ffffff08 }
  .skips{ display:flex; justify-content:space-between; margin-top:18px }

  .err{ color:#ff7b72; text-align:center; font-size:12px; min-height:16px; margin-top:14px }
  .hint{ color:var(--dim); text-align:center; font-size:11px; margin-top:6px }

  /* apps */
  #appsCard{ max-width:520px; margin:20px auto 0 }
  .chips{ display:flex; flex-wrap:wrap; gap:8px }
  .chips button{ border-radius:999px; padding:8px 14px }
  .chips button.press{ transform:scale(.95) }
</style>
</head>
<body>
<nav class="tabs"><a href="/lights.html">Lights</a><a href="/remote.html" class="active">Remote</a></nav>

<div id="np"><div id="npTitle">Apple TV</div><div id="npSub">…</div></div>

<div class="remote">
  <div class="top">
    <button class="btn small" data-cmd="sleep" data-hold="wake" title="Tap: sleep · hold: wake">
      <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  </div>

  <div class="pad" id="pad">
    <div class="arc" id="arc"></div>
    <i class="dot up"></i><i class="dot down"></i><i class="dot left"></i><i class="dot right"></i>
    <div class="center" id="center"></div>
  </div>

  <div class="grid">
    <button class="btn" data-cmd="menu" title="Back (Esc)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn" data-cmd="home" title="TV / Home (H)">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg></button>
    <button class="btn" data-cmd="toggle" title="Play / Pause (Space)">
      <svg viewBox="0 0 24 24"><path d="M5 5l7 7-7 7z" fill="currentColor"/><path d="M15 6v12M19 6v12"/></svg></button>
    <div class="vol">
      <button data-cmd="vol" data-arg="up" title="Volume up (+)">+</button>
      <button data-cmd="vol" data-arg="down" title="Volume down (−)">−</button>
    </div>
    <button class="btn" data-cmd="top" title="Top menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </div>

  <div class="skips">
    <button class="btn small" data-cmd="back" data-arg="10" title="Back 10s ([)">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg></button>
    <button class="btn small" data-cmd="prev" title="Previous">
      <svg viewBox="0 0 24 24"><path d="M18 6l-8 6 8 6z" fill="currentColor"/><path d="M6 6v12"/></svg></button>
    <button class="btn small" data-cmd="next" title="Next">
      <svg viewBox="0 0 24 24"><path d="M6 6l8 6-8 6z" fill="currentColor"/><path d="M18 6v12"/></svg></button>
    <button class="btn small" data-cmd="skip" data-arg="30" title="Forward 30s (])">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></svg></button>
  </div>
</div>

<div class="err" id="err"></div>
<div class="hint">Keyboard: arrows · Enter · Esc · Space · + / − · H · [ ]</div>

<section class="card" id="appsCard">
  <h2>Apps <small>tap to launch</small></h2>
  <div class="chips" id="apps"></div>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const FAVORITES = ["YouTube", "Netflix", "Hulu", "Disney+", "HBO Max", "Music", "TV", "Plex", "Prime Video", "Spotify"];
let errT;

async function tv(cmd, arg) {
  if (navigator.vibrate) navigator.vibrate(8);
  try {
    const r = await fetch("/tv", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({cmd, arg})}).then(r => r.json());
    if (!r.ok) showErr(r.output);
    if (["toggle", "next", "prev", "play", "pause", "launch", "select"].includes(cmd)) setTimeout(nowPlaying, 1200);
    return r;
  } catch { showErr("Hub unreachable"); }
}
function showErr(msg) { $("err").textContent = msg; clearTimeout(errT); errT = setTimeout(() => $("err").textContent = "", 4000); }
function flash(el) { el.classList.add("press"); setTimeout(() => el.classList.remove("press"), 140); }

// ---------- buttons (tap; power button: hold = wake) ----------
document.querySelectorAll("[data-cmd]").forEach(b => {
  let holdT, held = false;
  b.addEventListener("pointerdown", () => {
    b.classList.add("press"); held = false;
    if (b.dataset.hold) holdT = setTimeout(() => { held = true; tv(b.dataset.hold); }, 600);
  });
  const up = () => { b.classList.remove("press"); clearTimeout(holdT); };
  b.addEventListener("pointerup", () => { up(); if (!held) tv(b.dataset.cmd, b.dataset.arg); });
  b.addEventListener("pointerleave", up);
});

// ---------- clickpad: center = select, ring = direction (hold to repeat) ----------
const pad = $("pad"), arc = $("arc"), center = $("center");
const ARC_DEG = {up: 0, right: 90, down: 180, left: 270};
let repeatT;
function zone(e) {
  const r = pad.getBoundingClientRect();
  const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  if (Math.hypot(x, y) < r.width * 0.2) return "select";
  return Math.abs(x) > Math.abs(y) ? (x > 0 ? "right" : "left") : (y > 0 ? "down" : "up");
}
function showDir(dir) {
  if (dir === "select") { center.classList.add("press"); return; }
  arc.style.background = `conic-gradient(from ${ARC_DEG[dir] - 45}deg, #ffffff22 0 90deg, transparent 90deg)`;
  arc.classList.add("show");
  const d = pad.querySelector(".dot." + dir); d.style.background = "#fff"; d.style.boxShadow = "0 0 8px #fff";
}
function clearDir() {
  center.classList.remove("press"); arc.classList.remove("show");
  pad.querySelectorAll(".dot").forEach(d => { d.style.background = ""; d.style.boxShadow = ""; });
}
pad.addEventListener("pointerdown", (e) => {
  pad.setPointerCapture(e.pointerId);
  const dir = zone(e); showDir(dir); tv(dir);
  if (dir !== "select") repeatT = setTimeout(function rep() { tv(dir); repeatT = setTimeout(rep, 380); }, 500);
});
["pointerup", "pointercancel"].forEach(ev => pad.addEventListener(ev, () => { clearTimeout(repeatT); clearDir(); }));

// ---------- keyboard ----------
const KEYS = {ArrowUp: ["up"], ArrowDown: ["down"], ArrowLeft: ["left"], ArrowRight: ["right"],
  Enter: ["select"], Escape: ["menu"], Backspace: ["menu"], " ": ["toggle"], h: ["home"],
  "+": ["vol", "up"], "=": ["vol", "up"], "-": ["vol", "down"], "[": ["back", "10"], "]": ["skip", "30"]};
document.addEventListener("keydown", (e) => {
  const k = KEYS[e.key]; if (!k || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  if (["up", "down", "left", "right", "select"].includes(k[0])) { showDir(k[0]); setTimeout(clearDir, 150); }
  else { const el = document.querySelector(`[data-cmd="${k[0]}"]${k[1] ? `[data-arg="${k[1]}"]` : ""}`); if (el) flash(el); }
  tv(k[0], k[1]);
});

// ---------- now playing + apps ----------
async function nowPlaying() {
  if (document.hidden) return;
  try {
    const r = await fetch("/tv", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({cmd: "now"})}).then(r => r.json());
    const line = (r.output || "").split("\n")[0].trim();
    const m = line.match(/^(\S+)\s+(.*)$/);
    const [title, sub] = (m ? m[2] : line).split(" — ");
    $("npTitle").textContent = sub ? sub : (title || "Apple TV");
    $("npSub").textContent = sub ? `${m ? m[1] + "  " : ""}${title}` : (r.ok ? "Nothing playing" : "Not connected");
  } catch {}
}
async function loadApps() {
  const all = await fetch("/tv/apps").then(r => r.json()).catch(() => []);
  const favs = FAVORITES.filter(f => all.includes(f));
  let showAll = false;
  const draw = () => {
    const list = showAll ? all : favs;
    $("apps").innerHTML = list.map(a => `<button data-app="${a}">${a}</button>`).join("")
      + `<button class="ghost" id="allApps">${showAll ? "Fewer" : `All apps (${all.length})`}</button>`;
  };
  $("apps").addEventListener("click", (e) => {
    if (e.target.id === "allApps") { showAll = !showAll; return draw(); }
    const a = e.target.closest("[data-app]"); if (a) { flash(a); tv("launch", a.dataset.app); }
  });
  draw();
}
nowPlaying(); loadApps();
setInterval(nowPlaying, 10000);
document.addEventListener("visibilitychange", nowPlaying);
</script>
</body>
</html>
